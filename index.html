<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>建設現場の労働災害クイズ｜三和建設インターンシップ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <header class="app-header">
    <h1>建設現場の労働災害クイズ</h1>
    <p>三和建設インターンシップ 安全教育コンテンツ</p>
  </header>

  <div class="mascot-intro">
    <img src="assets/michiharo_placeholder.svg" alt="ミチハロくん（仮キャラクター）">
    <div class="speech-bubble">
      こんにちは、ミチハロくんだよ！<br>
      建設現場でよくある事故をクイズで学んでいこう。<br>
      1問答えると、すぐに正解と解説が見られるよ。
    </div>
  </div>

  <div class="mode-cards">
    <a class="mode-card" href="quiz.html">
      <h2>クイズを始める</h2>
      <p>労働災害の「死亡者数」「休業4日以上の死傷者数」がともに多い事故の型を中心に出題します。</p>
      <span class="count-badge">全50問からランダム3問</span>
    </a>
  </div>

  <p class="source-note">
    出題内容は厚生労働省「職場のあんぜんサイト」の労働災害事例・ヒヤリ・ハット事例等をもとに、
    学習用に要約・一般化して作成しています。マスコット画像は仮のプレースホルダーです。
  </p>
</div>
</body>
</html>
