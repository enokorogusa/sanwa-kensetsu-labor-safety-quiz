<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回答結果｜建設現場の労働災害クイズ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <header class="app-header">
    <h1 id="setTitle">クイズ</h1>
    <p id="setDesc"></p>
  </header>

  <div id="quizArea">
    <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel"></div>

    <div class="question-card">
      <div class="card-media">
        <span class="category-tag" id="categoryTag"></span>
        <img class="question-image" id="questionImage" alt="">
        <p class="image-credit" id="imageCredit"></p>
      </div>
      <div class="card-content">
        <div id="answerView">
          <p class="question-recap" id="questionRecap"></p>
          <div class="judge-banner" id="judgeBanner"></div>
          <p class="answer-summary" id="answerSummary"></p>
          <div class="mascot-comment">
            <img id="mascotImage" src="3Dミチハロ君.png" alt="ミチハロくん">
            <div class="speech-bubble" id="explanationText"></div>
          </div>
          <p class="source-note" id="sourceNote"></p>
          <button class="next-btn" id="nextBtn">次の問題へ</button>
        </div>
      </div>
    </div>
  </div>

  <a class="back-link" href="index.html">← トップに戻る</a>
</div>

<script src="data/category_images.js"></script>
<script src="data/questions.js"></script>
<script src="js/storage.js"></script>
<script src="js/answer.js"></script>
</body>
</html>
