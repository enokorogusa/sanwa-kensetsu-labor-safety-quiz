<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クイズ｜建設現場の労働災害クイズ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <header class="app-header">
    <h1 id="setTitle">クイズ</h1>
    <p id="setDesc"></p>
  </header>

  <div id="quizArea">
    <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel"></div>

    <div class="question-card">
      <div class="card-media">
        <span class="category-tag" id="categoryTag"></span>
        <img class="question-image" id="questionImage" alt="">
        <p class="image-credit" id="imageCredit"></p>
      </div>
      <div class="card-content">
        <div id="questionView">
          <p class="question-text" id="questionText"></p>
          <div class="choices" id="choices"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="finish-screen" id="finishScreen" style="display:none;">
    <p>お疲れさまでした！</p>
    <p class="score" id="finalScore"></p>
    <a class="primary-btn" href="index.html">トップへ戻る</a>
    <div class="finish-mascot-walk" aria-hidden="true"></div>
  </div>

  <a class="back-link" href="index.html">← トップに戻る</a>
</div>

<script src="data/category_images.js"></script>
<script src="data/questions.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
