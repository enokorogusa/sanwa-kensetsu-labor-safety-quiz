<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クイズ｜建設現場の労働災害クイズ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <header class="app-header">
    <h1 id="setTitle">クイズ</h1>
    <p id="setDesc"></p>
  </header>

  <div id="quizArea">
    <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel"></div>

    <div class="question-card">
      <span class="category-tag" id="categoryTag"></span>
      <img class="question-image" id="questionImage" alt="">
      <p class="image-credit" id="imageCredit"></p>
      <p class="question-text" id="questionText"></p>
      <div class="choices" id="choices"></div>

      <div class="result-panel" id="resultPanel">
        <p class="judge" id="judgeText"></p>
        <div class="mascot-comment">
          <img src="assets/michiharo_placeholder.svg" alt="ミチハロくん（仮キャラクター）">
          <div class="speech-bubble" id="explanationText"></div>
        </div>
        <p class="source-note" id="sourceNote"></p>
        <button class="next-btn" id="nextBtn">次の問題へ</button>
      </div>
    </div>
  </div>

  <div class="finish-screen" id="finishScreen" style="display:none;">
    <p>お疲れさまでした！</p>
    <p class="score" id="finalScore"></p>
    <a class="primary-btn" href="index.html">トップへ戻る</a>
  </div>

  <a class="back-link" href="index.html">← トップに戻る</a>
</div>

<script src="data/category_images.js"></script>
<script src="data/questions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
